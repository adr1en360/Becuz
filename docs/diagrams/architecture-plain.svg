<rect x="40" y="224" width="176" height="92" rx="6" fill="none" stroke="#1f2328" stroke-width="1" stroke-dasharray="5,4"/><text x="52" y="248" fill="#1f2328" font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Shop owner</text><text x="52" y="264" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">asks about the money</text><text x="52" y="278" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">for any 1 to 28 days</text>
<rect x="268" y="200" width="236" height="140" rx="6" fill="none" stroke="#1f2328" stroke-width="1"/><text x="280" y="224" fill="#1f2328" font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Planner</text><text x="280" y="240" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">Scout Intent signs the contract</text><text x="280" y="254" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">and picks the intent</text><text x="280" y="268" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">H-MEM recalls confirmed causes</text><text x="280" y="282" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">profit tree: daily_pnl vs the same</text><text x="280" y="296" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">days in the 4 earlier periods</text>
<rect x="556" y="224" width="192" height="92" rx="6" fill="none" stroke="#1f2328" stroke-width="1"/><text x="568" y="248" fill="#1f2328" font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Investigator</text><text x="568" y="264" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">tests one cause in SQL</text><text x="568" y="278" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">and proposes a claim</text>
