<rect x="1084" y="224" width="176" height="92" rx="6" fill="none" stroke="#1f2328" stroke-width="1"/><text x="1096" y="248" fill="#1f2328" font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Writer</text><text x="1096" y="264" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">builds the report from</text><text x="1096" y="278" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">supported claims only</text>
<rect x="1308" y="200" width="212" height="140" rx="6" fill="none" stroke="#1f2328" stroke-width="1" stroke-dasharray="5,4"/><text x="1320" y="224" fill="#1f2328" font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Owner&#x27;s report</text><text x="1320" y="240" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">the answer, or the causes</text><text x="1320" y="254" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">with their records</text><text x="1320" y="268" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">what was ruled out</text><text x="1320" y="282" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">cash kept apart from profit</text><text x="1320" y="296" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">what to do, and the outcome</text>
<rect x="268" y="440" width="480" height="96" rx="6" fill="none" stroke="#1f2328" stroke-width="1"/><text x="280" y="464" fill="#1f2328" font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Zetaris</text><text x="280" y="480" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">becuz USL over 4 sources: till, bank, books, context (incl. calendar)</text><text x="280" y="494" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">daily_pnl and transfer_check computed in Zetaris; read-only SQL</text>
<rect x="824" y="440" width="200" height="96" rx="6" fill="none" stroke="#1f2328" stroke-width="1"/><text x="836" y="464" fill="#1f2328" font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Meterless Nightshift</text><text x="836" y="480" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">NVIDIA Nemotron 3.5 Lightning</text><text x="836" y="494" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">the only model calls; rates</text><text x="836" y="508" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">evidence, never computes numbers</text>
<rect x="1084" y="440" width="176" height="96" rx="6" fill="none" stroke="#1f2328" stroke-width="1"/><text x="1096" y="464" fill="#1f2328" font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Shared claims</text><text x="1096" y="480" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">open, supported</text><text x="1096" y="494" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">or rejected</text>
<rect x="268" y="564" width="1252" height="24" rx="4" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,3"/><text x="280" y="580" fill="#57606a" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">logs/  every step is logged: trace, ledger, model receipts, scout, world, hmem, markovian</text>

