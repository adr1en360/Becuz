<title id="architecture-plain-title">How Becuz answers a question about the shop&#x27;s money</title>
<desc id="architecture-plain-desc">The owner asks about any 1 to 28 days. The Planner signs a Scout contract, recalls confirmed causes and measures the profit tree in Zetaris; what questions get one read-only query straight to the Writer, why questions go through the Investigator and the Checker, which re-runs the SQL and has Nemotron rate the evidence through Nightshift; the Writer reports supported claims only.</desc>
